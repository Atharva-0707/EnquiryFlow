<div class="submit-enquiry-container py-5">
  <div class="container">
    <!-- Page Header -->
    <div class="row mb-5">
      <div class="col-md-12">
        <h1 class="display-5 fw-bold text-primary mb-2">
          <i class="fa fa-paper-plane-o me-2"></i>Submit Your Enquiry
        </h1>
        <p class="text-muted lead">Fill out the form below to submit your enquiry. We'll get back to you shortly.</p>
      </div>
    </div>

    <!-- Form Card -->
    <div class="row">
      <div class="col-lg-8 mx-auto">
        <form class="enquiry-form">
          <!-- Personal Information Section -->
          <div class="form-section mb-5">
            <div class="section-header mb-4">
              <i class="fa fa-user text-primary"></i>
              <h3 class="d-inline-block ms-2">Personal Information</h3>
            </div>
            <div class="row g-3">
              <div class="col-md-6">
                <label for="customerName" class="form-label fw-bold">
                  <i class="fa fa-user-circle text-info me-2"></i>Full Name
                </label>
                <input type="text" class="form-control form-control-lg" id="customerName" placeholder="Enter your full name" required>
              </div>
              <div class="col-md-6">
                <label for="customerPhone" class="form-label fw-bold">
                  <i class="fa fa-phone text-info me-2"></i>Phone Number
                </label>
                <input type="tel" class="form-control form-control-lg" id="customerPhone" placeholder="Enter your phone number" required>
              </div>
              <div class="col-12">
                <label for="customerEmail" class="form-label fw-bold">
                  <i class="fa fa-envelope text-info me-2"></i>Email Address
                </label>
                <input type="email" class="form-control form-control-lg" id="customerEmail" placeholder="Enter your email address" required>
              </div>
            </div>
          </div>

          <!-- Enquiry Details Section -->
          <div class="form-section mb-5">
            <div class="section-header mb-4">
              <i class="fa fa-comments text-success"></i>
              <h3 class="d-inline-block ms-2">Enquiry Details</h3>
            </div>
            <div class="row g-3">
              <div class="col-md-6">
                <label for="enquiryType" class="form-label fw-bold">
                  <i class="fa fa-tag text-success me-2"></i>Enquiry Type
                </label>
                <input type="text" class="form-control form-control-lg" id="enquiryType" placeholder="e.g., Product, Service, General" required>
              </div>
              <div class="col-md-6">
                <label for="categoryId" class="form-label fw-bold">
                  <i class="fa fa-list text-success me-2"></i>Category
                </label>
                <select class="form-select form-select-lg" id="categoryId" required>
                  <option value="">Select a category</option>
                  <option value="1">Technical Support</option>
                  <option value="2">Billing & Payments</option>
                  <option value="3">Product Information</option>
                  <option value="4">Feedback</option>
                  <option value="5">General Inquiry</option>
                </select>
              </div>
              <div class="col-12">
                <label for="message" class="form-label fw-bold">
                  <i class="fa fa-pencil text-success me-2"></i>Message
                </label>
                <textarea class="form-control form-control-lg" id="message" rows="6" placeholder="Please describe your enquiry in detail..." required></textarea>
              </div>
            </div>
          </div>

          <!-- Enquiry Status Section -->
          <div class="form-section mb-5">
            <div class="section-header mb-4">
              <i class="fa fa-flag text-warning"></i>
              <h3 class="d-inline-block ms-2">Status & Dates</h3>
            </div>
            <div class="row g-3">
              <div class="col-md-6">
                <label for="statusId" class="form-label fw-bold">
                  <i class="fa fa-hourglass-o text-warning me-2"></i>Status
                </label>
                <select class="form-select form-select-lg" id="statusId" required>
                  <option value="">Select a status</option>
                  <option value="1">Open</option>
                  <option value="2">In Progress</option>
                  <option value="3">Pending</option>
                  <option value="4">Resolved</option>
                  <option value="5">Closed</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="enquiryDate" class="form-label fw-bold">
                  <i class="fa fa-calendar text-warning me-2"></i>Enquiry Date
                </label>
                <input type="date" class="form-control form-control-lg" id="enquiryDate" required>
              </div>
              <div class="col-md-6">
                <label for="followUpDate" class="form-label fw-bold">
                  <i class="fa fa-calendar-check-o text-warning me-2"></i>Follow-up Date
                </label>
                <input type="date" class="form-control form-control-lg" id="followUpDate">
              </div>
              
              <div class="col-md-6">
                <label for="isConverted" class="form-label fw-bold">
                  <i class="fa fa-check-circle text-warning me-2"></i>Converted
                </label>
                <div class="form-check form-switch mt-2">
                  <input class="form-check-input" type="checkbox" id="isConverted">
                  
                  <label class="form-check-label" for="isConverted">
                    Mark as converted
                  </label>
                </div>
              </div>
            </div>
          </div>

          <!-- Additional Information Section -->
          <div class="form-section mb-5">
            <div class="section-header mb-4">
              <i class="fa fa-lightbulb-o text-info"></i>
              <h3 class="d-inline-block ms-2">Additional Information</h3>
            </div>
            <div class="row g-3">
              <div class="col-12">
                <label for="feedback" class="form-label fw-bold">
                  <i class="fa fa-star text-info me-2"></i>Feedback (Optional)
                </label>
                <textarea class="form-control form-control-lg" id="feedback" rows="4" placeholder="Share your feedback or additional comments..."></textarea>
              </div>
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="form-section mb-5">
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
              <button type="reset" class="btn btn-outline-secondary btn-lg">
                <i class="fa fa-undo me-2"></i>Clear Form
              </button>
              <button type="submit" class="btn btn-primary btn-lg">
                <i class="fa fa-paper-plane-o me-2"></i>Submit Enquiry
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
