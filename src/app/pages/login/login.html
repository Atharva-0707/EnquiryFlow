<div class="login-container py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <div class="login-card card shadow-lg border-0">
          <div class="card-body p-4">
            <!-- Header -->
            <div class="text-center mb-4">
              <i class="fa fa-user-circle fa-3x text-primary mb-3"></i>
              <h3 class="card-title fw-bold text-primary">Welcome Back</h3>
              <p class="text-muted">Sign in to your account</p>
            </div>

            <!-- Login Form -->
            <form>
              <!-- Email Field -->
              <div class="mb-3">
                <label for="email" class="form-label fw-bold">
                  <i class="fa fa-envelope text-info me-2"></i>Email Address
                </label>
                <input type="email" [(ngModel)]="loginObj.username" name="username" class="form-control form-control-lg" id="email" placeholder="Enter your email" required>
              </div>

              <!-- Password Field -->
              <div class="mb-3">
                <label for="password" class="form-label fw-bold">
                  <i class="fa fa-lock text-info me-2"></i>Password
                </label>
                <input type="password" [(ngModel)]="loginObj.password" name="password" class="form-control form-control-lg" id="password" placeholder="Enter your password" required>
              </div>

              <!-- Remember Me & Forgot Password -->
              <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="rememberMe">
                  <label class="form-check-label" for="rememberMe">
                    Remember me
                  </label>
                </div>
                <a href="#" class="text-primary text-decoration-none">Forgot Password?</a>
              </div>

              <!-- Login Button -->
              <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg fw-bold" (click)="onLogin()">
                  <i class="fa fa-sign-in me-2"></i>Sign In
                </button>
              </div>
            </form>

            <!-- Divider -->
            <hr class="my-4">

            <!-- Sign Up Link -->
            <div class="text-center">
              <p class="mb-0">Don't have an account?
                <a href="#" class="text-primary fw-bold text-decoration-none">Sign Up</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
